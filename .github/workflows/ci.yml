# What runs on every push and pull request. See "CI" in docs/testing.md for what
# it covers and what it leaves out (no timing). The LLVM steps are in
# llvm-steps.yml.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref stops the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    # A pull request from a branch of this repository is already tested by the
    # push of that branch. Only pull requests from forks run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            os: ubuntu-24.04
          - name: linux/arm64
            os: ubuntu-24.04-arm
          - name: darwin/arm64
            os: macos-15
          # amd64 binaries on the arm64 runner, which Rosetta runs. The
          # native C engine is built for the runner, so it is left out here.
          - name: darwin/amd64
            os: macos-15
            goarch: amd64
            no-native: true
          # The native C engine needs clang. Format and docs are the same as on
          # the other platforms, and gofmt prints paths with backslashes here.
          - name: windows/amd64
            os: windows-2025
            no-native: true
            no-format: true
    defaults:
      run:
        # Git Bash on windows, for the scripts.
        shell: bash
    env:
      # Empty: the runner's own architecture.
      GOARCH: ${{ matrix.goarch }}
    # The checks that need no LLVM: scripts/check.sh runs them and keeps a log
    # for each in .build/check-logs.
    steps:
      # The recorded outputs are compared byte for byte, so git must not turn
      # their line ends into CRLF.
      - name: Keep line ends as they are
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Show the machine
        run: (lscpu | grep "Model name") || sysctl -n machdep.cpu.brand_string || echo "$PROCESSOR_IDENTIFIER"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet -asmdecl=false ./...
      - name: Format and docs
        if: ${{ !matrix.no-format }}
        run: CHECK_ONLY="gofmt docs" scripts/check.sh fast

      - name: Test, packages other than the root
        run: go test -count=1 -short -p 2 -timeout 60m $(go list ./... | grep -v '/slowjs$')
      - name: Test, internal packages with the test hooks
        run: go test -count=1 -tags testhooks ./internal/cengine ./internal/gohost ./internal/hostmem ./internal/idtable
      - name: Test, root package
        run: CHECK_ONLY="root" scripts/check.sh full

      - name: Native C engine against the recorded outputs
        if: ${{ !matrix.no-native }}
        run: CHECK_ONLY="host-plain compare-plain" scripts/check.sh fast

      - name: Keep the logs of the checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs-${{ strategy.job-index }}
          path: .build/check-logs
          if-no-files-found: ignore
          retention-days: 7
