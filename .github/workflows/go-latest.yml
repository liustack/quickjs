# Once a week, the tests on the newest stable Go (job engine), and on each Go
# release the module lets build (job releases, scripts/go-versions.sh). The
# generated assembly depends on details inside Go (stack layout, the
# runtime's use of registers, linker names), and a new Go release can change
# them. A failure of the job engine is a warning for us to read, not a check
# for merging. A Go newer than the one the engine was checked with stops the
# build (internal/goversion), so that job builds with quickjs_anygo.
name: go-latest

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  engine:
    name: engine (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            os: ubuntu-24.04
          - name: linux/arm64
            os: ubuntu-24.04-arm
          - name: darwin/arm64
            os: macos-15
          # amd64 binaries on the arm64 runner, which Rosetta runs
          - name: darwin/amd64
            os: macos-15
            goarch: amd64
          - name: windows/amd64
            os: windows-2025
    defaults:
      run:
        # Git Bash on windows.
        shell: bash
    env:
      # Empty: the runner's own architecture.
      GOARCH: ${{ matrix.goarch }}
    steps:
      # Keep the line ends of the recorded outputs as they are.
      - name: Keep line ends as they are
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
      - run: go version
      - name: Test, internal packages with the test hooks
        run: go test -count=1 -tags testhooks,quickjs_anygo ./internal/cengine ./internal/gohost ./internal/hostmem ./internal/idtable
      - name: Test, root package
        run: go test -count=1 -p 1 -timeout 60m -tags quickjs_anygo .

  # The Go releases the module lets build: the go line of go.mod and the
  # newest patch release of each minor version up to the one
  # internal/goversion stops. Unlike the job above, a failure here is a
  # release liustack/quickjs says it supports.
  releases:
    name: releases (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            os: ubuntu-24.04
          - name: linux/arm64
            os: ubuntu-24.04-arm
          - name: darwin/arm64
            os: macos-15
          - name: windows/amd64
            os: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line ends as they are
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: GO_VERSIONS_LIST=1 scripts/go-versions.sh
      - name: Tests with each release
        run: scripts/go-versions.sh
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-versions-${{ strategy.job-index }}
          path: .build/go-versions
